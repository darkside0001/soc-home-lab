
<!-- soc-home-lab: extra agent configuration (appended to ossec.conf) -->
<ossec_config>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/auth.log</location>
  </localfile>
  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/syslog</location>
  </localfile>

  <syscheck>
    <directories realtime="yes" check_all="yes" report_changes="yes">/etc/sudoers,/etc/sudoers.d</directories>
    <directories realtime="yes" check_all="yes">/root/.ssh,/home</directories>
    <directories realtime="yes" check_all="yes">/etc/cron.d,/var/spool/cron/crontabs</directories>
  </syscheck>
</ossec_config>
